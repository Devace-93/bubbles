<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bubbles — play</title>
    <meta name="description" content="Pop fruit bubbles before time runs out." />
    <link rel="icon" href="/art/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bubbles — pop the fruit, beat the clock" />
    <meta property="og:description" content="Pop fruit bubbles before time runs out. Can you beat my score?" />
    <meta property="og:url" content="%VITE_SITE_URL%/play/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og/share.png" />
    <style>
      * { margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #0a4d6e 0%, #0e7f9e 45%, #35d0ba 100%);
      }
      /* column layout: the game takes whatever height the footer leaves, so a
         footer that wraps on narrow phones never covers the canvas */
      body { display: flex; flex-direction: column; }
      #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
      #game { position: relative; flex: 1 1 auto; min-height: 0; z-index: 1; }
      /* knife cursor on devices with a mouse; hotspot at the blade tip */
      @media (pointer: fine) {
        #game canvas { cursor: url("/art/knife.svg") 3 3, pointer; }
      }
      #foot {
        position: relative; z-index: 2; flex: 0 0 auto;
        display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; justify-content: center;
        padding: 6px 10px; padding-bottom: calc(6px + env(safe-area-inset-bottom));
        font: 13px system-ui, sans-serif; color: #e8f1f7;
        background: rgba(3, 41, 61, 0.55);
      }
      #foot a { color: #fff; white-space: nowrap; }
      #foot button {
        background: none; border: 1px solid rgba(255, 255, 255, 0.5); color: #fff;
        border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 12px;
      }
      @media (max-width: 560px) {
        #foot { gap: 2px 12px; font-size: 12px; padding-top: 4px; }
      }
      /* pay.js donate mount: arcade accent, hidden while the portal keeps the button away */
      .support-mount { --accent: #ffb347; display: flex; }
      .support-mount:empty { display: none; }
    </style>
  <!-- retro feedback widget (bug reports, feedback, feature requests); the project key is public by design -->
  <script src="https://retro.3m4.net/widget.js" data-project-key="retro_pub_vRS5mKfHjFmL_uAwIX5yq0QHeY4Gzo_M" defer></script>
  <!-- metrics web analytics (page views, visitors, referrers, devices; cookie-less); the project key is public by design -->
  <script src="https://metrics.3m4.net/m.js" data-key="metrics_pub_JIGKUKBTNSOvjxgPTWXJ1iPvqdyrRfdd" defer></script>
  <!-- oops error tracking (uncaught errors, rejected promises, breadcrumbs); the project key is public by design -->
  <script src="https://oops.3m4.net/o.js" data-key="oops_pub_ijTZswTzPA8WatHI_1umPRtntErVmjrk" data-env="production" defer></script>
  <!-- 3m4 session widget (accounts.3m4.net): optional login; the end screen saves scores when signed in -->
  <script src="%VITE_ACCOUNTS_URL%/session.js" data-mount="#session" defer></script>
  <!-- pay.js donate button (payments.3m4.net, CONTRACT.md §10): one tag per mount, every tag shares window.m4pay.
       The portal gates donations per viewer and only mounts the button when the switch is on; the mounts stay hidden
       while empty. data-label is the English default: src/i18n.ts applyEmbedLabels() rewrites it from the `donate`
       catalog key (data-i18n-label) on every language apply(), and pay.js re-renders when <html lang> changes. -->
  <script src="%VITE_PAYMENTS_URL%/pay.js" data-app="bubbles" data-kind="donate" data-currency="usd" data-amount="500" data-label="Buy me a coffee ☕" data-i18n-label="donate" data-mount="#support-footer" defer></script>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="game"></div>
    <div id="topbar" style="position: fixed; top: 12px; right: 14px; z-index: 2; display: flex; align-items: center; gap: 8px">
      <div id="session"></div>
      <div id="sound-ctl"></div>
      <div id="lang-sel"></div>
    </div>
    <footer id="foot">
      <a data-i18n="madeBy" href="https://www.linkedin.com/in/enrique-magallon/" target="_blank" rel="noopener"></a>
      <a href="https://github.com/Devace-93/bubbles" data-i18n="source"></a>
      <a href="%VITE_INFO_URL%">info.3m4.net</a>
      <a href="https://elevenlabs.io" target="_blank" rel="noopener">Voice by elevenlabs.io</a>
      <button id="share-btn" type="button" data-i18n="share"></button>
      <div id="support-footer" class="support-mount"></div>
    </footer>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>

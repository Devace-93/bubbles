# Everything runs in containers; no local Python needed.
#
#   docker compose up --build            # Postgres + API (migrates, then serves on :8000, live reload)
#   docker compose run --rm test         # pytest against the bubbles_test database
#   docker compose run --rm api python scripts/migrate.py   # migrations only
#   docker compose down                  # stop (add -v to drop the database)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bubbles
      POSTGRES_PASSWORD: bubbles
      POSTGRES_DB: bubbles
    ports:
      - "${BUBBLES_DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # creates the bubbles_test database on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubbles -d bubbles"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    volumes:
      - .:/app          # live source; the dev image installs the package editable
    environment:
      DATABASE_URL: postgresql://bubbles:bubbles@db:5432/bubbles
      # Identity service (accounts.3m4.net). Locally the accounts stack listens
      # on :8085 and its API is `accounts-api-1` on the shared `edge` network.
      ACCOUNTS_URL: ${ACCOUNTS_URL:-http://localhost:8085}
      ACCOUNTS_INTERNAL_URL: ${ACCOUNTS_INTERNAL_URL:-http://accounts-api-1:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4323}
      PORT: 8000
    ports:
      - "${BUBBLES_API_PORT:-8000}:8000"
    networks: [default, edge]
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    environment:
      TEST_DATABASE_URL: postgresql://bubbles:bubbles@db:5432/bubbles_test
      CORS_ORIGINS: http://localhost:5173
    command: pytest
    depends_on:
      db:
        condition: service_healthy

# `edge` is the network the accounts stack publishes its API on (created by
# `make up` in ~/accounts, or `docker network create edge`).
networks:
  edge:
    external: true

volumes:
  dbdata:

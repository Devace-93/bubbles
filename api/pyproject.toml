[project]
name = "bubbles-api"
version = "0.1.0"
description = "Accounts and leaderboard API for the Bubbles game"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "psycopg[binary,pool]>=3.2,<4",
  # Session verification against accounts.3m4.net (EdDSA JWT + JWKS fetch).
  "PyJWT[crypto]>=2.9,<3",
  "requests>=2.32",
  "flask-cors>=5.0",
  "flask-limiter>=3.8",
  "gunicorn>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bubbles_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
